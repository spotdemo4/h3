name: WebTransport browser interop
on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1

jobs:
  interop:
    # The README's Chrome and Firefox badges match these job names. Safari runs on Forgejo
    # (.forgejo/workflows/safari.yml) because GitHub's macOS runners rarely pick up jobs.
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Chrome
            os: ubuntu-latest
            browser: chrome
            mode: hash
          - name: Firefox
            os: ubuntu-latest
            browser: firefox
            mode: hash
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Show browser versions
        run: |
          case "${{ matrix.browser }}" in
            chrome) google-chrome --version ;;
            firefox) firefox --version ;;
          esac
      - name: Build server
        run: cargo build --example webtransport_server
      - name: Run interop test
        env:
          WT_INTEROP_OUT: ${{ runner.temp }}/wt-interop
        run: ci/webtransport-interop/interop.sh ${{ matrix.browser }} ${{ matrix.mode }}
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wt-interop-${{ matrix.browser }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/wt-interop
