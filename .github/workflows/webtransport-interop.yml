name: WebTransport browser interop
on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1

jobs:
  interop:
    name: ${{ matrix.browser }} (${{ matrix.mode }}, drafts ${{ matrix.drafts || 'all' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Informational jobs record browser behaviour that is expected to fail today.
    continue-on-error: ${{ matrix.informational || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            browser: safari
            mode: trusted
          - os: macos-26
            browser: safari
            mode: hash
          # Safari 26 offers drafts 07 and 13, but cancels its CONNECT unless the server
          # advertises draft 07, so a server offering only draft 13 fails. That job should start
          # passing once Safari accepts draft 13 on its own.
          - os: macos-26
            browser: safari
            mode: trusted
            drafts: "02,07"
          - os: macos-26
            browser: safari
            mode: trusted
            drafts: "02,13"
            informational: true
          - os: ubuntu-latest
            browser: chrome
            mode: hash
          - os: ubuntu-latest
            browser: firefox
            mode: hash
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Show browser versions
        run: |
          case "${{ matrix.browser }}" in
            safari)
              sw_vers
              defaults read /Applications/Safari.app/Contents/Info.plist CFBundleShortVersionString
              ;;
            chrome) google-chrome --version ;;
            firefox) firefox --version ;;
          esac
      - name: Enable safaridriver
        if: matrix.browser == 'safari'
        run: sudo safaridriver --enable
      - name: Build server
        run: cargo build --example webtransport_server
      - name: Run interop test
        env:
          WT_INTEROP_OUT: ${{ runner.temp }}/wt-interop
          WT_DRAFTS: ${{ matrix.drafts }}
        run: ci/webtransport-interop/interop.sh ${{ matrix.browser }} ${{ matrix.mode }}
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wt-interop-${{ matrix.browser }}-${{ matrix.mode }}-drafts-${{ matrix.drafts || 'all' }}
          path: ${{ runner.temp }}/wt-interop
