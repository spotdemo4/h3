[package]
name = "trev-h3-datagram"
version.workspace = true
edition = "2021"
documentation = "https://docs.rs/trev-h3-datagram"
repository.workspace = true
readme = "readme.md"
description = "rfc9297 extension for the h3 crate. Fork of h3-datagram for trev-h3."
keywords = ["http3", "quic", "rfc9297"]
categories = ["network-programming", "web-programming"]
license = "MIT"

[lib]
name = "h3_datagram"

[dependencies]
bytes = "1.4"
tracing = { version = "0.1.40", optional = true }

[features]
tracing = ["dep:tracing"]

[dependencies.h3]
workspace = true
features = ["i-implement-a-third-party-backend-and-opt-into-breaking-changes"]
