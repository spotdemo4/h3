[package]
name = "trev-h3-quinn"
version.workspace = true
rust-version = "1.74.1"
authors = ["Jean-Christophe BEGUE <jc.begue@pm.me>"]
edition = "2021"
documentation = "https://docs.rs/trev-h3-quinn"
repository.workspace = true
readme = "README.md"
description = "QUIC transport implementation based on Quinn. Fork of h3-quinn for trev-h3."
keywords = ["http3", "quic", "h3"]
categories = ["network-programming", "web-programming"]
license = "MIT"

[lib]
name = "h3_quinn"

[dependencies]
h3 = { workspace = true }
bytes = "1"
quinn = { version = "0.11.9", default-features = false, features = [
    "futures-io",
] }
tokio-util = { version = "0.7.9" }
futures-util = { version = "0.3.28", default-features = false }
h3-datagram = { workspace = true, optional = true }
tracing = { version = "0.1.40", optional = true }

[features]
tracing = ["dep:tracing"]
datagram = ["dep:h3-datagram"]
