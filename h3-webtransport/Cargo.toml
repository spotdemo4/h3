[package]
name = "trev-h3-webtransport"
version.workspace = true
edition = "2021"
documentation = "https://docs.rs/trev-h3-webtransport"
repository.workspace = true
readme = "readme.md"
description = "webtransport extension for h3. Fork of h3-webtransport for trev-h3."
keywords = ["http3", "quic", "webtransport"]
categories = ["network-programming", "web-programming"]
license = "MIT"

[lib]
name = "h3_webtransport"

[dependencies]
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
pin-project-lite = { version = "0.2", default-features = false }
tracing = "0.1.37"
tokio = { version = "1.28", default-features = false }
h3-datagram = { workspace = true }

[dependencies.h3]
workspace = true
features = ["i-implement-a-third-party-backend-and-opt-into-breaking-changes"]

[dev-dependencies]
h3-quinn = { package = "trev-h3-quinn", path = "../h3-quinn", features = ["datagram"] }
quinn = { version = "0.11", default-features = false, features = [
    "runtime-tokio",
    "rustls",
    "ring",
] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std"] }
tokio = { version = "1", features = ["rt", "macros", "time", "io-util"] }
